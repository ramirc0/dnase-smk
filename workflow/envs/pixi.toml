[workspace]
name = "dnase-smk-envs"
channels = ["conda-forge"]
platforms = ["linux-64"]
exclude-newer = "7d"

[dependencies]
python = "3.12.*"
polars = ">=1.43"
matplotlib = ">=3.11"

[pypi-dependencies]
poikilos = { git = "https://github.com/ramirc0/poikilos", extras = ["labels"] }

# Rule jobs only save figures. Without this, a job that inherits DISPLAY picks a GUI backend.
[activation.env]
MPLBACKEND = "Agg"
