executor: slurm
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

jobs: unlimited
max-jobs-per-timespan: 5/1s
# ILP re-solves a model per batch of finished jobs. It only pays off with temp()
# outputs. Greedy starts big-input jobs first, so give a small blocking rule `priority:`.
scheduler: greedy

slurm-efficiency-report: true
slurm-efficiency-report-path: logs/efficiency
slurm-efficiency-threshold: 0.8
slurm-init-seconds-before-status-checks: 10

default-resources:
  slurm_partition: 4hours
  runtime: 240m
  mem_mb: 4000 * attempt
  # bwa-mem3 needs AVX2.
  constraint: cascadelake

set-threads:              # single-threaded rules get the default, 1
  mappable_bases: 4
  bwa_mem3_index: 32
  align: 32
  filter: 16
  bam_qc: 4
  insert_sizes: 4
  hotspot3: 6
  dispersion_model: 16
  footprints: 16

set-resources:              # tune from benchmarks/ TSVs after a real run
  align:
    slurm_partition: 12hours
    mem_mb: 32000 * attempt
    runtime: 720m
  bwa_mem3_index:
    slurm_partition: 12hours
    mem_mb: 96000 * attempt
    runtime: 720m
  filter:
    slurm_partition: 12hours
    mem_mb: 32000 * attempt
    runtime: 720m
  hotspot3:
    slurm_partition: 12hours
    mem_mb: 96000 * attempt
    runtime: 720m
  dispersion_model:
    slurm_partition: 12hours
    mem_mb: 32000 * attempt
    runtime: 720m
  footprints:
    slurm_partition: 12hours
    mem_mb: 32000 * attempt
    runtime: 720m

  # GPU rule pattern (uncomment + adapt for a CUDA rule):
  #  fit:
  #    slurm_partition: gpu
  #    gres: gpu:1
  #    tasks_per_gpu: 0     # suppress --ntasks-per-gpu (conflicts with cpus-per-task for pytorch)
  #    mem_mb: 48000 * attempt
  #    runtime: 1440m
  #    gpu_slots: 1         # counts against the global cap below

# GPU queue depth (uncomment with the GPU rule pattern). With jobs: unlimited,
# every ready GPU job queues at once and blocks other users on a FIFO cluster.
# Cap it at 2x the partition's physical GPUs, so one job waits per running one.
# resources:
#   gpu_slots: 72              # gpu partition: 2 x 36 V100s

rerun-incomplete: true
keep-going: true
show-failed-logs: true
benchmark-extended: true
retries: 1
slurm-requeue: false
printshellcmds: true
latency-wait: 60
