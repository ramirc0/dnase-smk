# Local execution.
software-deployment-method:
  - pixi
# Snakemake copies every env package here. pixi installs from its own cache.
# One copy per user instead of one per workdir.
software-deployment-cache-prefix: ~/.cache/snakemake/software

cores: 32
printshellcmds: true
rerun-incomplete: true
keep-going: true
show-failed-logs: true
retries: 1
benchmark-extended: true

default-resources:          # fallback for trivial rules
  mem_mb: 4000
  runtime: 240

set-threads:                # single-threaded rules get the default, 1
  mappable_bases: 4
  bwa_mem3_index: 32
  align: 32
  filter: 16
  bam_qc: 4
  insert_sizes: 4
  hotspot3: 6
  dispersion_model: 16
  footprints: 16

set-resources:              # tune from benchmarks/ TSVs after a real run
  align: {mem_mb: 64000}       # bwa-mem3 peaked at 34 GB on GRCh38
  filter: {mem_mb: 32000}
  hotspot3: {mem_mb: 96000}
  dispersion_model: {mem_mb: 32000}
  footprints: {mem_mb: 32000}
  bwa_mem3_index: {mem_mb: 96000}
